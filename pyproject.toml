[project]
name = "eng-agent"
version = "0.1.0"
description = "GitHub engineering agent using LangGraph"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",

    # Configuration
    "python-dotenv>=1.0.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",

    # HTTP
    "httpx>=0.27.0",
    "requests>=2.32.0",

    # LangChain / LangGraph
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-ollama>=0.2.0",
    "langchain-core>=0.3.0",

    # GitHub
    "PyGithub>=2.3.0",

    # Google Cloud
    "google-cloud-pubsub>=2.21.0",
    "google-cloud-firestore>=2.16.0",
    "google-cloud-secret-manager>=2.20.0",

    # Logging
    "structlog>=24.1.0",

    # JSON validation
    "jsonschema>=4.23.0",

    # Retry utilities
    "tenacity>=9.0.0",

    # Typing
    "typing-extensions>=4.12.0",

]

[project.optional-dependencies]
dev = [
    "black>=24.4.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "reportlab>=4.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*", "config*"]

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "C4",
    "N",
    "A",
    "RET",
    "RUF",
]

ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unused_configs = true
warn_return_any = true
warn_unused_ignores = true


[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
